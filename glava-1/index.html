<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ленивая хозяйка 2.0 — Пролог</title>
<meta name="description" content="Новый год у тебя. Всем отделом!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Caveat:wght@600;700&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--night:#0E0B12;--ember:#E85D3A;--glow:#FF8A4C;--gold:#E9C98E;--paper:#F3E6CC;--ink:#3A1E0E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--night);color:#F6EEE4;font:16px/1.5 Inter,system-ui,sans-serif;overflow:hidden}
.stage{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden;background:#000}
.bg{position:absolute;left:0;right:0;top:0;bottom:calc(var(--ph,200px) - 40px);background-size:cover;background-position:center 30%;transition:opacity .8s,filter .6s;opacity:0}
.bg.top{bottom:0}
.bg:not(.top){background-size:contain;background-repeat:no-repeat;background-position:center bottom}
#vid{position:absolute;left:0;right:0;top:0;bottom:calc(var(--ph,200px) - 40px);width:100%;height:calc(100% - var(--ph,200px) + 40px);object-fit:contain;object-position:center bottom;opacity:0;transition:opacity .5s;pointer-events:none}
#vid.on{opacity:1}
#vid.top{bottom:auto;height:auto;object-fit:fill;object-position:center top}
.stage.cardmode #vid{filter:blur(7px) brightness(.5)}
.bgblur{position:absolute;left:0;right:0;top:0;bottom:calc(var(--ph,200px) - 40px);background-size:cover;background-position:center;filter:blur(22px) brightness(.55);transform:scale(1.15);transition:background-image .8s}
.stage.cardmode .bg{filter:blur(7px) brightness(.5);bottom:0}
.bg.on{opacity:1}
.bg.contain{background-size:contain;background-repeat:no-repeat;background-position:center 12%;background-color:#1a1218}
.bg.top{background-size:100% auto;background-repeat:no-repeat;background-position:center top;background-color:#140e10}
.shade{position:absolute;left:0;right:0;bottom:0;height:calc(var(--ph,200px) + 70px);background:linear-gradient(to top,rgba(10,7,12,.96) 38%,rgba(10,7,12,.7) 65%,transparent);pointer-events:none}
.panel{position:absolute;left:0;right:0;bottom:0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));z-index:3}
.who{display:inline-block;font:800 12px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--night);background:var(--gold);border-radius:999px;padding:3px 10px;margin-bottom:8px}
.who.hero{background:#E8833A;color:#fff}
.who.boss{background:#BFE3F2;color:#173B4F;box-shadow:0 0 10px rgba(191,227,242,.45)}
.who.chef{background:#2F5D46;color:#F4EFD8;border:1px solid #6E9B7F}
.who.coll{background:#F2B8C6;color:#5A1E2E}
.txt{font-size:17.5px;line-height:1.5;min-height:3em;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.txt em{color:var(--gold);font-style:normal}
.back{position:absolute;right:14px;top:-34px;background:rgba(14,11,18,.6);border:1px solid rgba(233,201,142,.35);color:#E9DCCD;border-radius:999px;padding:5px 12px;font:600 13px Inter,sans-serif;cursor:pointer;z-index:4}
.tap{margin-top:10px;font-size:12.5px;color:#BFAFA3;text-align:right;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
.choices{display:grid;gap:9px;margin-top:12px}
.btn{display:block;width:100%;text-align:left;border:1.5px solid rgba(233,201,142,.45);background:rgba(30,22,28,.82);color:#F6EEE4;border-radius:14px;padding:13px 15px;font:600 15.5px Inter,sans-serif;cursor:pointer}
.btn:active{transform:scale(.99)}
.btn.main{background:var(--ember);border-color:var(--ember);text-align:center;font-weight:800;box-shadow:0 8px 22px rgba(232,93,58,.35)}
input.field{width:100%;border:1.5px solid rgba(233,201,142,.55);background:rgba(20,14,18,.9);color:#fff;border-radius:14px;padding:14px 15px;font:600 17px Inter,sans-serif;margin-top:12px;outline:none}
input.field:focus{border-color:var(--glow)}
.click{position:absolute;inset:0;z-index:2;cursor:pointer}

/* выжженное */
.burn{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;background:radial-gradient(ellipse at 50% 60%,#2A140C,#0A0608 70%);z-index:4}
.burn p{font-family:Caveat,cursive;font-weight:700;font-size:clamp(30px,9vw,42px);line-height:1.15;color:#FF9A5C;margin:0 0 12px;text-shadow:0 0 12px rgba(255,120,50,.9),0 0 30px rgba(232,93,58,.6)}
.c{opacity:0;display:inline-block}
.c.on{animation:burnin .8s ease forwards}
@keyframes burnin{0%{opacity:0;color:#fff;filter:blur(4px)}40%{opacity:1;color:#FFE0B0}100%{opacity:1;filter:none}}
.pre{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:clamp(18px,5.5vw,24px);letter-spacing:.06em;color:#CDB89A;margin:0 0 26px;opacity:0;transition:opacity 1.4s}
.pre.on{opacity:.85}
.slam{animation:slam .6s ease forwards}
@keyframes slam{0%{transform:scale(1)}30%{transform:scale(1.04)}100%{transform:scale(.2);opacity:0}}

/* карточки-экраны */
.card{position:absolute;left:16px;right:16px;top:9%;z-index:2;border-radius:22px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.6);animation:rise .5s ease both}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.chat{background:#E9E4DD;color:#222;padding:0 0 12px}
.chat .top{background:#5B7FA6;color:#fff;padding:12px 16px;font-weight:700;font-size:15px}
.chat .top small{display:block;font-weight:500;opacity:.8;font-size:12px}
.msg{margin:10px 12px 0;max-width:82%;background:#fff;border-radius:14px 14px 14px 4px;padding:9px 12px;font-size:15px;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.msg b{display:block;font-size:12.5px;color:#C0546A}
.msg .pic{margin-top:6px;height:110px;border-radius:10px;background:linear-gradient(135deg,#F7D9A8,#E9A86A);display:flex;align-items:center;justify-content:center;font-size:44px}
.msg small{display:block;text-align:right;color:#999;font-size:11px}
.shop{background:#fff;color:#222;padding:16px}
.shop .logo{font-weight:800;color:#E85D3A;font-size:14px;letter-spacing:.06em}
.shop h3{margin:10px 0 4px;font-size:19px}
.shop .img{height:150px;border-radius:14px;background:radial-gradient(circle at 30% 40%,#F2C77E 0 18%,transparent 19%),radial-gradient(circle at 65% 55%,#D9763E 0 16%,transparent 17%),radial-gradient(circle at 45% 70%,#8FB36A 0 14%,transparent 15%),linear-gradient(135deg,#3B2A22,#1F1612);margin:10px 0}
.shop .price{font-size:30px;font-weight:800;color:#C83A1E}
.shop .sub{color:#777;font-size:13px}
.search{background:#fff;color:#222;padding:14px}
.search .bar{border:1.5px solid #ddd;border-radius:999px;padding:9px 14px;font-size:14px;color:#444}
.res{display:flex;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:10px 2px}
.res .ic{flex:0 0 48px;height:48px;border-radius:10px;background:#EDEFF2;display:flex;align-items:center;justify-content:center;font-size:24px}
.res b{display:block;font-size:14.5px}
.res span{color:#C83A1E;font-weight:800;font-size:15px}
.note{background:var(--paper);color:var(--ink);padding:22px 20px;border-radius:6px;transform:rotate(-1.5deg);
  box-shadow:inset 0 0 22px 6px rgba(80,40,15,.45),0 20px 50px rgba(0,0,0,.6)}
.note p{font-family:Caveat,cursive;font-weight:700;font-size:27px;line-height:1.2;margin:0}
.note small{display:block;font-style:italic;color:#6B4A33;margin-top:10px;font-size:14px}
.note .verso{margin-top:14px;font-family:Caveat,cursive;font-size:22px;color:#8A3A1A}

/* стол */
.table{position:absolute;left:0;right:0;top:0;aspect-ratio:768/1376}
.lensbox{position:absolute;left:0;right:0;top:0;aspect-ratio:768/1344;pointer-events:none}
.lenstxt{position:absolute;left:44.3%;top:35%;transform:translate(-50%,-50%) rotate(-9deg);font-family:Caveat,cursive;font-weight:700;font-size:clamp(18px,6.2vw,32px);color:#2F4A1C;white-space:nowrap;opacity:.12;filter:blur(3px);transition:opacity 1.6s,filter 1.6s;text-shadow:0 0 1px rgba(255,255,230,.4)}
.lenstxt.on{opacity:.88;filter:blur(0)}
.place{position:absolute;transform:translate(-50%,-50%);cursor:default}
.place img{width:100%;display:block;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
.place .q{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font:700 clamp(14px,4.4vw,22px) "Cormorant Garamond",serif;color:#B48A55;opacity:.9}
.place.cur .q{color:var(--ember);animation:pulse 1.6s infinite}
.place .g{position:absolute;left:50%;top:100%;transform:translateX(-50%);white-space:nowrap;font:700 11px Inter,sans-serif;background:rgba(14,11,18,.85);color:var(--gold);border-radius:8px;padding:2px 7px}
.counter{position:absolute;left:12px;right:84px;white-space:nowrap;font-size:12px!important;top:calc(env(safe-area-inset-top) + 10px);text-align:left;z-index:3;font:700 13px Inter,sans-serif;color:#fff;text-shadow:0 1px 4px #000}
.counter b{color:var(--gold)}

.game{position:absolute;inset:0;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 44px) 16px 24px;z-index:4}
.gt{background:rgba(14,11,18,.82);border:1px solid rgba(233,201,142,.3);border-radius:16px;padding:12px 14px;font-size:15px}
.gt ol{margin:8px 0 6px;padding-left:20px}.gt li{margin:3px 0}.gt small{color:#BFAFA3}
.gt .who{margin-bottom:6px}
.cab{margin:12px 0 8px;background:linear-gradient(#6B4A33,#4A3222);border-radius:14px;padding:8px;display:grid;gap:8px}
.crow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border-bottom:7px solid #3A2414;padding-bottom:6px}
.crow:last-child{border-bottom:0;padding-bottom:0}
.cell{height:66px;border-radius:10px;background:rgba(255,230,190,.08);border:1.5px dashed rgba(233,201,142,.25);display:flex;align-items:center;justify-content:center;cursor:pointer}
.cell .itm{width:100%;height:100%}
.shelves{margin:12px 0 8px;background:linear-gradient(#6B4A33,#4A3222);border-radius:14px;padding:8px}
.shelf{position:relative;min-height:66px;border-bottom:7px solid #3A2414;margin-bottom:8px;padding:4px 4px 4px 74px;cursor:pointer;border-radius:6px;background:rgba(255,230,190,.07)}
.shelf:last-child{margin-bottom:0}
.shelf i{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-style:normal;font-size:12px;color:#E9C98E;font-weight:700}
.slot,.tray{display:flex;flex-wrap:wrap;gap:6px}
.tray{min-height:70px;padding:6px;border:1.5px dashed rgba(233,201,142,.4);border-radius:14px;margin-bottom:10px}
.itm{display:flex;flex-direction:column;align-items:center;justify-content:center;width:70px;height:60px;border-radius:12px;border:2px solid transparent;background:#F6EEE4;color:#3A1E0E;font-size:26px;line-height:1;cursor:pointer;padding:2px}
.itm span{font:600 10.5px Inter,sans-serif;margin-top:3px}
.itm.lock{opacity:.85;box-shadow:inset 0 0 0 2px #6E9B7F}
.itm.sel{border-color:var(--ember);box-shadow:0 0 0 3px rgba(232,93,58,.35);transform:scale(1.06)}
.xw{margin:12px auto 6px;display:flex;flex-direction:column;gap:3px;width:max-content;max-width:100%}
.xr{display:flex;gap:3px;align-items:center}
.xr.bad{animation:xshake .4s}
@keyframes xshake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.xn{width:min(16px,4vw);font:700 11px Inter,sans-serif;color:#BFAFA3;text-align:right;margin-right:2px}
.xc,.xe{width:min(32px,8.2vw);height:min(32px,8.2vw);flex:none}
.xc{border:1.5px solid rgba(233,201,142,.45);background:rgba(243,230,204,.94);color:#3A1E0E;border-radius:5px;text-align:center;font:800 min(18px,4.6vw) Inter,sans-serif;padding:0;text-transform:uppercase;caret-color:#E85D3A;outline:none}
.xc:focus{border-color:#E85D3A;box-shadow:0 0 0 2px rgba(232,93,58,.4)}
.xc.key{background:#F6D88E;border-color:#C9962E}
.xr.ok .xc{background:#CFE6C0;border-color:#7FAF63}
.xr.ok .xc.key{background:#FFD45E;border-color:#B8860B;box-shadow:0 0 10px rgba(255,200,80,.8)}
.xq{background:rgba(14,11,18,.82);border:1px solid rgba(233,201,142,.3);border-radius:16px;padding:10px 14px 10px 32px;font-size:14px;margin:8px 0 10px}
.xq li{margin:4px 0;color:#F3EADF}.xq li i{color:#BFAFA3;font-style:normal}
.xq li.on{color:#FFD9A8}.xq li.ok{color:#9FCF86;text-decoration:line-through;text-decoration-color:rgba(159,207,134,.5)}
.xans{font:700 34px "Cormorant Garamond",serif;letter-spacing:.12em;color:#FFD45E;text-shadow:0 0 14px rgba(255,190,80,.7);margin-bottom:4px}
.place .star{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:clamp(28px,10vw,48px);line-height:1;color:#FFD45E;text-shadow:0 0 10px rgba(255,200,80,.95),0 0 3px #000;animation:pulse 1.8s infinite}
.gmsg{margin-top:10px;text-align:center;font-size:15px;color:#FFE6C4;min-height:22px}
.game .field{position:relative;height:50vh;margin:12px 0 10px;border-radius:16px;overflow:hidden;background:linear-gradient(#2A1E28,#3A2A22);touch-action:none;border:1px solid rgba(233,201,142,.3);padding:0}
.hud{position:absolute;left:10px;right:10px;top:8px;display:flex;justify-content:space-between;font:800 16px Inter,sans-serif;color:#E9C98E;z-index:2}
.basket{position:absolute;bottom:4%;left:50%;transform:translateX(-50%);font-size:46px}
.drop{position:absolute;transform:translateX(-50%);font-size:32px;pointer-events:none}
.pop{position:absolute;bottom:16%;transform:translateX(-50%);font:800 16px Inter,sans-serif;color:#FFE6C4;animation:popup .6s ease forwards;pointer-events:none}
@keyframes popup{to{transform:translate(-50%,-40px);opacity:0}}
.plist{background:var(--paper);color:var(--ink);border-radius:8px;padding:18px 18px 14px;box-shadow:inset 0 0 22px 6px rgba(80,40,15,.35),0 18px 40px rgba(0,0,0,.5);margin-bottom:12px}
.plist .pk{font:800 11px Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#9A5A22}
.plist h3{font-family:'Cormorant Garamond',serif;font-size:26px;margin:2px 0 0}
.plist .ps{font-family:Caveat,cursive;font-size:20px;color:#8A4A22;margin-bottom:6px}
.plist ul{margin:0;padding-left:18px}.plist li{margin:5px 0;font-size:15px}
.plist li small{display:block;color:#7A5A40;font-size:12.5px}
.plist .pn{margin-top:10px;font-size:13px;color:#7A5A40}

/* живые картинки: медленная камера, снег, мерцание, свет */
.bg.on.kb{animation:kb 18s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.07) translate(var(--kbx,0%),var(--kby,-1.2%))}}
#fx{position:absolute;inset:0;pointer-events:none}
#snow{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity 1s}
#snow.on{opacity:1}
#glow{position:absolute;inset:0;opacity:0;transition:opacity 1s;mix-blend-mode:screen}
#glow.on{opacity:1;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{filter:brightness(.85)}45%{filter:brightness(1.15)}60%{filter:brightness(.95)}}
#twinkle{position:absolute;inset:0}
#twinkle i{position:absolute;width:10px;height:10px;margin:-5px;border-radius:50%;background:radial-gradient(circle,#FFF3C8 0,rgba(255,210,120,.7) 35%,transparent 70%);opacity:0;animation:tw 2.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.6)}50%{opacity:.9;transform:scale(1.2)}}
.stage.cardmode #fx{opacity:.4}
@media (prefers-reduced-motion:reduce){.bg.on.kb{animation:none}#snow{display:none}}
.intro{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:center;padding:30px 26px;background:radial-gradient(ellipse at 50% 70%,#2A140C,#0A0608 72%);text-align:center}
.intro .ik{font:700 11px Inter,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#CDB89A}
.intro .it{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:40px;line-height:1.1;margin:10px 0 2px;background:linear-gradient(180deg,#FFF1C9,#E9B865 55%,#B9782E);-webkit-background-clip:text;background-clip:text;color:transparent}
.intro .is{font-family:Caveat,cursive;font-size:24px;color:#F6D9A8;margin-bottom:30px}
.intro .ih{margin-top:14px;font-size:13px;color:#9C8E84}
.intro.off{display:none}
.sndbtn{position:absolute;top:calc(env(safe-area-inset-top) + 8px);right:88px;z-index:5;background:rgba(0,0,0,.4);border:0;color:#ddd;border-radius:10px;padding:6px 9px;font:600 13px Inter,sans-serif;cursor:pointer}
.nextbtn{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;border:0;cursor:pointer;
  font-size:24px;color:#fff;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 35% 30%,#FF9A5C,#E85D3A 55%,#B5361A);
  box-shadow:0 0 0 0 rgba(232,93,58,.6),0 6px 16px rgba(120,40,10,.5);animation:nudge2 1.4s ease-in-out infinite,ring2 1.9s ease-out infinite;z-index:4}
.nextbtn:active{transform:scale(.94)}
@keyframes nudge2{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@keyframes ring2{0%{box-shadow:0 0 0 0 rgba(232,93,58,.6),0 6px 16px rgba(120,40,10,.5)}80%,100%{box-shadow:0 0 0 16px rgba(232,93,58,0),0 6px 16px rgba(120,40,10,.5)}}
.panel:has(.nextbtn) .txt{padding-right:62px}
.panel:has(.nextbtn) a.btn{margin-right:64px}
.rules{list-style:none;margin:6px 0 0;padding:0}
.rules li{position:relative;padding-left:26px;margin:0 0 8px;font-size:15.5px}
.rules li::before{content:"✦";position:absolute;left:0;color:var(--gold)}
.riddle{font-family:Caveat,cursive;font-weight:700;font-size:23px;line-height:1.22;color:#FFE6C4;margin:6px 0 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#F3EADF;color:#15121A;font-weight:700;border-radius:12px;padding:10px 16px;font-size:14px;opacity:0;transition:.3s;z-index:9;pointer-events:none}
.toast.on{opacity:1}
.restart{position:absolute;top:calc(env(safe-area-inset-top) + 8px);right:10px;z-index:5;background:rgba(0,0,0,.4);border:0;color:#ddd;border-radius:10px;padding:6px 10px;font:600 12px Inter,sans-serif;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.c{opacity:1}}
/* ноутбук/планшет горизонтально: картинка целиком слева, текст справа */
@media (min-aspect-ratio:4/5) and (min-width:700px){
 :root{--iw:calc(100vh*9/16)}
 .stage{max-width:none;width:min(100vw,calc(var(--iw) + 460px))}
 .bg,.bgblur,#vid,#fx{right:auto!important;width:var(--iw);bottom:0!important}
 #vid{height:100%}
 .stage:not(.cardmode) #layer{position:absolute;left:0;top:0;bottom:0;width:var(--iw)}
 .stage.cardmode .bg,.stage.cardmode .bgblur{width:auto;right:0!important}
 .shade{left:var(--iw);top:0;height:auto!important;background:linear-gradient(to right,rgba(10,7,12,.75),#0E0B12 60px)}
 .panel{left:var(--iw);top:0;display:flex;flex-direction:column;justify-content:flex-start;padding:30vh 34px 120px;overflow-y:auto}
 .panel .txt{font-size:19px}
 .panel .who{align-self:flex-start}
 .back{top:18px;right:auto;left:34px}
 .nextbtn{position:fixed;right:max(34px,calc(50vw - (var(--iw) + 460px)/2 + 34px));bottom:40px}
 .panel:has(.nextbtn) .txt{padding-right:0}
 .click{right:auto;width:var(--iw)}
 .card{right:auto;width:calc(var(--iw) - 32px)}
 .stage:has(.game) .shade{display:none}
 .panel:has(.nextbtn) a.btn{margin-right:0}
}

/* ===== ДОСЬЕ ===== */
.dosbtn{position:absolute;top:calc(env(safe-area-inset-top) + 46px);right:10px;z-index:5;background:rgba(0,0,0,.4);border:0;color:#F3E2C4;border-radius:10px;padding:6px 10px;font:600 13px Inter,sans-serif;cursor:pointer}
.dosbtn.new::after{content:'';position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:#E85D3A;box-shadow:0 0 8px #E85D3A;animation:pulse 1.4s infinite}
.dos{position:fixed;inset:0;z-index:8;background:rgba(10,7,12,.96);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 16px) 16px 40px}
.dos[hidden]{display:none}

var snowCv=null,snowCx=null,flakes=[],snowAmt=0,snowRAF=0;
function snowInit(){snowCv=document.getElementById('snow');snowCx=snowCv.getContext('2d');function size(){var r=snowCv.getBoundingClientRect();snowCv.width=r.width*devicePixelRatio;snowCv.height=r.height*devicePixelRatio}size();addEventListener('resize',size);
  (function loop(){var W=snowCv.width,H=snowCv.height,want=Math.round(110*snowAmt);
    while(flakes.length<want)flakes.push({x:Math.random()*W,y:Math.random()*H,r:(Math.random()*1.8+.6)*devicePixelRatio,v:(Math.random()*.6+.35)*devicePixelRatio,s:Math.random()*6.28});
    if(flakes.length>want)flakes.length=want;
    snowCx.clearRect(0,0,W,H);snowCx.fillStyle='rgba(255,255,255,.85)';
    flakes.forEach(function(f){f.y+=f.v;f.s+=.02;f.x+=Math.sin(f.s)*.4*devicePixelRatio;if(f.y>H){f.y=-5;f.x=Math.random()*W}snowCx.beginPath();snowCx.arc(f.x,f.y,f.r,0,6.28);snowCx.fill()});
    snowRAF=requestAnimationFrame(loop)})();}
function applyFx(src,isTable){

  else{document.querySelectorAll('.bg').forEach(function(b){b.classList.remove('kb')});}
  applyFx._last=src;

  var g=document.getElementById('glow');g.style.background=f.glow||'none';g.classList.toggle('on',!!f.glow);
  if(isTable){g.style.bottom='auto';g.style.height=(innerWidth>520?520:innerWidth)*1376/768+'px'}else{g.style.bottom='';g.style.height=''}
  var tw=document.getElementById('twinkle');tw.innerHTML='';

function aud(n){var a=new Audio('audio/'+n+'.mp3?v=2');a.preload='auto';return a}
function ambTo(key){
  if(!SND.on){if(SND.amb){SND.amb.pause();SND.amb=null;SND.ambKey=''}return}
  if(key===SND.ambKey)return;var old=SND.amb;SND.ambKey=key;SND.amb=null;
  if(old){var v=old.volume,t=setInterval(function(){v-=.04;if(v<=0){clearInterval(t);old.pause()}else old.volume=v},40)}
  if(!key)return;var a=aud(key);a.loop=true;a.volume=0;SND.amb=a;a.play().catch(function(){});
  var v2=0,t2=setInterval(function(){v2+=.03;if(v2>=.32||SND.amb!==a){clearInterval(t2)}else a.volume=v2},50);
}
function sfx(n,vol){if(!SND.on)return;var a=aud(n);a.volume=vol||.7;a.play().catch(function(){})}
function say(key){
  if(SND.voice){SND.voice.pause();SND.voice=null}
  if(!SND.on||VOICED.indexOf(key)<0)return;
  var a=aud(key);a.volume=1;SND.voice=a;
  if(SND.amb)SND.amb.volume=.14;
  a.onended=function(){if(SND.amb&&SND.voice===a)SND.amb.volume=.32};
  a.play().catch(function(){});
}

function vidScene(img){
  var v=document.getElementById('vid');
  if(!VID[img]){v.classList.remove('on');v.pause();vidFor='';return}
  if(vidFor===img)return; // тот же кадр в следующей сцене — ролик уже отыгран и стоит на последнем кадре
  if(VID_START[img]&&curId!==VID_START[img]){v.classList.remove('on');v.pause();return} // ждём нужную реплику
  vidFor=img;v.classList.remove('on');v.src=VID[img];v.currentTime=0;v.loop=!!VID_LOOP[img];v.classList.toggle('top',img==='img/stol.webp');
  // телефон не грузит ролик заранее — запускаем сразу, показываем, когда реально пошёл
  v.muted=true;v.setAttribute('muted','');v.playsInline=true;
  v.onplaying=function(){if(vidFor===img)v.classList.add('on')};
  var pr=v.play();if(pr&&pr.catch)pr.catch(function(){v.classList.remove('on')});
}

  shell('<div class="gt"><span class="who chef">Шеф</span><div>Задачка на смекалку. В шкафу три полки, <b>на каждой по три места</b>. Расставь всех девятерых.</div><ol>'+
   '<li>Картошка стоит прямо под мясом.</li>'+
   '<li>Лук — сосед картошки по полке, слева от неё.</li>'+
   '<li>Масло стоит прямо под луком.</li>'+
   '<li>Бульон — между маслом и перцем.</li>'+
   '<li>Тимьян левее лавра.</li></ol><small>Нажми на продукт, потом на место в шкафу. Нажми на занятое место — продукты поменяются.</small></div>'+
   '<div class="cab" id="cab">'+[0,1,2].map(function(r){return '<div class="crow">'+[0,1,2].map(function(c){return '<div class="cell" data-cell="'+r+'-'+c+'"></div>'}).join('')+'</div>'}).join('')+'</div>'+
   '<div class="tray" id="tray"></div><button class="btn main" id="chk">Проверить</button><button class="btn" id="hint" style="margin-top:8px;text-align:center">Подсказка</button><div class="gmsg" id="gmsg"></div>');
  function who(cell){for(var k in place)if(place[k]===cell)return k;return null}
  function byId(id){return ITEMS.filter(function(it){return it[0]===id})[0]}
  function draw(){
   layer.querySelectorAll('.cell').forEach(function(el){el.innerHTML=''});$('tray').innerHTML='';
   ITEMS.forEach(function(it){var b=document.createElement('button');b.className='itm'+(sel===it[0]?' sel':'')+(it.lock?' lock':'');b.innerHTML=it[1]+'<span>'+it[2]+'</span>';
     b.onclick=function(e){e.stopPropagation();
       if(sel&&sel!==it[0]&&place[it[0]]){if(it.lock)return;var cell=place[it[0]],from=place[sel];place[sel]=cell;if(from)place[it[0]]=from;else delete place[it[0]];sel=null;$('gmsg').textContent='';draw();return}
       if(it.lock)return;sel=(sel===it[0]?null:it[0]);draw()};
     var host=place[it[0]]?layer.querySelector('[data-cell="'+place[it[0]]+'"]'):$('tray');host.appendChild(b)});
  }
  layer.querySelectorAll('.cell').forEach(function(el){el.onclick=function(){if(!sel)return;var cell=el.dataset.cell,o=who(cell);
    if(o){if(byId(o).lock)return;var from=place[sel];if(from)place[o]=from;else delete place[o]}
    place[sel]=cell;sel=null;$('gmsg').textContent='';draw()}});
  $('tray').onclick=function(){if(sel&&!byId(sel).lock){delete place[sel];sel=null;draw()}};
  $('hint').onclick=function(){
   var wrong=ITEMS.filter(function(it){return place[it[0]]!==it[3]&&!it.lock});
   if(!wrong.length)return;var it=wrong[0],o=who(it[3]);
   if(o){var from=place[it[0]];if(from)place[o]=from;else delete place[o]}
   place[it[0]]=it[3];it.lock=true;hints++;sel=null;draw();
   $('gmsg').innerHTML='Подсказка: <b>'+it[2]+'</b> — на своём месте.';
  };
  $('chk').onclick=function(){
   if(Object.keys(place).length<ITEMS.length){$('gmsg').textContent='Не всё расставлено. Кто остался на подносе?';return}
   var miss=ITEMS.filter(function(it){return place[it[0]]!==it[3]}).length;
   if(miss){$('gmsg').innerHTML='Не сходится: <b>'+miss+' '+plural(miss,'продукт','продукта','продуктов')+'</b> не на своих местах. Перечитай условие.';return}
   $('gmsg').innerHTML='<b>'+(hints?'Решено! Садись, четыре с плюсом.':'Отлично! Садись, пять.')+'</b>';setTimeout(function(){go(c.next)},1100);
  };
  draw();
 },
 cross:function(c){
  // слово-ключ БУЛАНЖЕР по вертикали; третий элемент — индекс буквы ключа в слове
  var W=[['Им заливают мясо с картошкой, чтобы не пересохли','БУЛЬОН',0],['Режешь — плачешь','ЛУК',1],['Лист, который кладут в блюдо, а потом вынимают','ЛАВР',0],['Сливочное, кусочками сверху','МАСЛО',1],
         ['Зубчики, но не у пилы','ЧЕСНОК',3],['«Твоих рук — пятнадцать минут, остальное сделают ... и время»','ЖАР',0],['Кусок свиньи, который Шеф берёт на урок','ШЕЯ',1],['Её режут кружочками и ставят рядами','КАРТОФЕЛЬ',2]];
  var KC=3,COLS=10,done={};
  var grid='<div class="xw" id="xw">'+W.map(function(w,r){var st=KC-w[2],h='<div class="xr" data-r="'+r+'"><span class="xn">'+(r+1)+'</span>';
    for(var x=0;x<COLS;x++){var i=x-st;h+=(i>=0&&i<w[1].length)?'<input class="xc'+(x===KC?' key':'')+'" data-r="'+r+'" data-i="'+i+'" maxlength="1" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text">':'<span class="xe"></span>'}
    return h+'</div>'}).join('')+'</div>';
  shell('<div class="gt"><span class="who chef">Шеф</span><div>Кроссворд со звёздочкой. Разгадай все слова — и в <b>золотом столбце</b> сложится название блюда первого декабря.</div><small>Нажми на клетку и печатай. Слово разгадано — строка загорится.</small></div>'+
   grid+'<ol class="xq" id="xq">'+W.map(function(w,r){return '<li data-r="'+r+'">'+w[0]+' <i>('+w[1].length+')</i></li>'}).join('')+'</ol>'+
   '<button class="btn" id="xh" style="text-align:center">Подсказка — открыть слово</button><div class="gmsg" id="gmsg"></div>');
  var cells=[].slice.call(layer.querySelectorAll('.xc'));
  function rowCells(r){return cells.filter(function(e){return +e.dataset.r===r})}
  function norm(v){return (v||'').toUpperCase().replace(/Ё/g,'Е').replace(/[^А-Я]/g,'')}
  function check(r){var rc=rowCells(r),w=W[r][1],val=rc.map(function(e){return e.value}).join('');
    if(val.length<w.length)return;
    var row=layer.querySelector('.xr[data-r="'+r+'"]');
    if(val===w){done[r]=true;row.classList.add('ok');rc.forEach(function(e){e.readOnly=true});layer.querySelector('#xq li[data-r="'+r+'"]').classList.add('ok');
      var nx=cells.filter(function(e){return !done[+e.dataset.r]&&!e.value})[0];if(nx)nx.focus();
      if(Object.keys(done).length===W.length)win()}
    else{row.classList.remove('bad');void row.offsetWidth;row.classList.add('bad')}}
  cells.forEach(function(e){
    e.onfocus=function(){layer.querySelectorAll('#xq li').forEach(function(li){li.classList.toggle('on',li.dataset.r===e.dataset.r)})};
    e.oninput=function(){var v=norm(e.value);e.value=v.slice(-1);if(e.value){var rc=rowCells(+e.dataset.r),j=rc.indexOf(e);if(j<rc.length-1)rc[j+1].focus();check(+e.dataset.r)}};
    e.onkeydown=function(ev){if(ev.key==='Backspace'&&!e.value){var rc=rowCells(+e.dataset.r),j=rc.indexOf(e);if(j>0&&!rc[j-1].readOnly){rc[j-1].value='';rc[j-1].focus();ev.preventDefault()}}};
  });
  $('xh').onclick=function(){var r=W.map(function(w,i){return i}).filter(function(i){return !done[i]})[0];if(r===undefined)return;
    rowCells(r).forEach(function(e,i){e.value=W[r][1][i]});check(r)};
  function win(){
    $('xh').style.display='none';
    $('gmsg').innerHTML='<div class="xans">БУЛАНЖЕР</div><b>Отличница!</b> Это и есть блюдо первого декабря.<button class="btn main" id="xgo" style="margin-top:10px">Сдать Шефу ⭐</button>';
    $('xgo').onclick=function(){S.guess.g1='Буланжер';S.stars=S.stars||{};S.stars.g1=true;save();go(c.next)};
  }
 },
 catch:function(c){
  var GOOD=['🥩','🥔','🧅','🧄','🧈','🌿'],BAD=['🍫','🍕','🍬','🥫','🧃','🍔'],NEED=10,TIME=30;
  shell('<div class="gt"><span class="who chef">Шеф</span><div>Лови в корзину только то, что пойдёт в дело: мясо, картошку, лук, чеснок, масло и зелень. Сладкое и фастфуд — мимо! Нужно <b>'+NEED+'</b> продуктов за '+TIME+' секунд.</div><small>Води корзину пальцем по полю.</small></div>'+
   '<div class="field" id="fieldc"><div class="hud"><span id="cnt">0 / '+NEED+'</span><span id="tm">'+TIME+'</span></div><div class="basket" id="bsk">🧺</div></div><button class="btn main" id="gobtn">Поехали!</button><div class="gmsg" id="gmsg"></div>');
  var fld=$('fieldc'),bsk=$('bsk'),run=false,got=0,left=TIME,drops=[],bx=50,raf,tick,spawnT;
  function setX(px){var r=fld.getBoundingClientRect();bx=Math.max(8,Math.min(92,(px-r.left)/r.width*100));bsk.style.left=bx+'%'}
  fld.addEventListener('pointermove',function(e){if(run)setX(e.clientX)});
  fld.addEventListener('pointerdown',function(e){if(run)setX(e.clientX)});
  fld.addEventListener('touchmove',function(e){if(run){setX(e.touches[0].clientX);e.preventDefault()}},{passive:false});
  function spawn(){var good=Math.random()<.62,el=document.createElement('div');el.className='drop';el.textContent=(good?GOOD:BAD)[Math.random()*6|0];
    var x=6+Math.random()*88;el.style.left=x+'%';fld.appendChild(el);drops.push({el:el,x:x,y:-8,v:.55+Math.random()*.5+(TIME-left)*.012,good:good})}
  function loop(){
    for(var i=0;i<drops.length;i++){var d=drops[i];d.y+=d.v;d.el.style.top=d.y+'%';
      if(!d.hit&&d.y>78&&d.y<90&&Math.abs(d.x-bx)<11){d.hit=true;d.el.remove();
        if(d.good){got++;flash('+1')}else{got=Math.max(0,got-1);flash('мимо!')} $('cnt').textContent=got+' / '+NEED;
        if(got>=NEED){win();return}}
      if(d.y>104&&!d.hit){d.hit=true;d.el.remove()}}
    drops=drops.filter(function(d){return !d.hit});
    if(run)raf=requestAnimationFrame(loop);
  }
  function flash(t){var f=document.createElement('div');f.className='pop';f.textContent=t;f.style.left=bx+'%';fld.appendChild(f);setTimeout(function(){f.remove()},600)}
  function stop(){run=false;cancelAnimationFrame(raf);clearInterval(tick);clearInterval(spawnT);drops.forEach(function(d){d.el.remove()});drops=[]}
  function win(){stop();$('gmsg').innerHTML='<b>Корзина полная! Садись, пять.</b>';setTimeout(function(){go(c.next)},900)}
  $('gobtn').onclick=function(){
    if(run)return;got=0;left=TIME;$('cnt').textContent='0 / '+NEED;$('tm').textContent=left;$('gmsg').textContent='';this.textContent='Ещё раз';
    run=true;raf=requestAnimationFrame(loop);spawnT=setInterval(spawn,520);
    tick=setInterval(function(){left--;$('tm').textContent=left;if(left<=0){stop();$('gmsg').innerHTML='Время вышло: '+got+' из '+NEED+'. Не беда — попробуй ещё раз!'}},1000);
  };
  window._catchStop=stop;
 }
};

function b64e(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64d(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';return JSON.parse(decodeURIComponent(escape(atob(t))))}
function saveLink(){
  var data={n:S.name,g:S.guess,st:S.stars||{},l:!!S.list1,d:!!S.done};
  var url=location.href.split('#')[0]+'#save='+b64e(data);
  function ok(){toast('Ссылка скопирована — отправь её себе')}
  if(matchMedia('(pointer:coarse)').matches&&navigator.share){navigator.share({title:'Мой прогресс — Ленивая хозяйка 2.0',url:url}).catch(function(){});return}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).then(ok,function(){prompt('Скопируй ссылку:',url)});else prompt('Скопируй ссылку:',url);
}
(function restoreFromLink(){
  var m=location.hash.match(/save=([\w-]+)/);if(!m)return;
  try{var d=b64d(m[1]);
    if(confirm('Восстановить прогресс'+(d.n?' «'+d.n+'»':'')+' на этом устройстве?')){
      S.name=d.n||S.name;S.guess=d.g||{};S.stars=d.st||{};S.list1=!!d.l;S.done=!!d.d;S.scene=d.d?'end':'start';save();}
  }catch(e){}
  history.replaceState(null,'',location.href.split('#')[0]);
})();
